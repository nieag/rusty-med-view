[package]
name = "rust_starter_app"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = { version = "27", features = ["webgl"] }
winit = "0.30"
pollster = "0.3"
bytemuck = { version = "1.14", features = ["derive"] }
cgmath = "0.18"
hecs = "0.10"
egui = "0.33"
egui-wgpu = "0.33"
egui-winit = { version = "0.33", default-features = false, features = ["links"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "console"] }
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"
web-time = "1.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
