name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rustfmt Check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -- -D warnings -A clippy::too-many-arguments

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Tests
        run: cargo test

  build-native:
    name: Build Native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli
        run: |
          # Use a specific version to match Cargo.toml or just latest compatible
          # Standard Ubuntu runners have a lot of tools, but wasm-bindgen is usually not there
          cargo install wasm-bindgen-cli
      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Generate Bindings
        run: |
          mkdir -p dist
          wasm-bindgen --out-dir dist --target web target/wasm32-unknown-unknown/release/rust_starter_app.wasm
